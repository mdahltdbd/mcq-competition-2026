
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MCQ COMPETITION 2026 — Admin Results</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      padding: 20px;
      color: #1e293b;
    }

    main {
      max-width: 600px;
      margin: 30px auto;
      background: white;
      padding: 24px;
      border-radius: 12px;
    }

    h1 {
      color: #166534;
    }

    .status {
      padding: 15px;
      margin: 18px 0;
      border-radius: 8px;
      background: #f1f5f9;
    }

    button {
      width: 100%;
      padding: 13px;
      margin: 7px 0;
      border: 0;
      border-radius: 8px;
      color: white;
      background: #166534;
      cursor: pointer;
      font-size: 16px;
    }

    button.hide {
      background: #b91c1c;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>

<body>
  <main>
    <h1>Admin — ফলাফল নিয়ন্ত্রণ</h1>

    <p>শুধু অনুমোদিত অ্যাডমিন এই পেজ ব্যবহার করবেন।</p>

    <div id="status" class="status" role="status">
      বর্তমান অবস্থা লোড হচ্ছে...
    </div>

    <button id="publishBtn" type="button">
      ফলাফল প্রকাশ করুন
    </button>

    <button id="hideBtn" class="hide" type="button">
      ফলাফল গোপন করুন
    </button>
  </main>

  <script>
    const statusBox = document.getElementById("status");
    const publishBtn = document.getElementById("publishBtn");
    const hideBtn = document.getElementById("hideBtn");

    async function loadStatus() {
      publishBtn.disabled = true;
      hideBtn.disabled = true;

      try {
        const response = await fetch(
          "/api/admin/results-status",
          { credentials: "same-origin" }
        );

        const data = await response.json();

        if (!response.ok || !data.success) {
          statusBox.textContent =
            data.message || "অবস্থা লোড করা যায়নি।";
          return;
        }

        statusBox.textContent = data.published
          ? "বর্তমান অবস্থা: ফলাফল প্রকাশিত"
          : "বর্তমান অবস্থা: ফলাফল গোপন";

        publishBtn.disabled = data.published;
        hideBtn.disabled = !data.published;

      } catch (error) {
        statusBox.textContent = "সার্ভারের সঙ্গে যোগাযোগ করা যায়নি।";
      }
    }

    async function setPublication(published) {
      const action = published ? "প্রকাশ" : "গোপন";

      if (!confirm("আপনি কি ফলাফল " + action + " করতে চান?")) {
        return;
      }

      publishBtn.disabled = true;
      hideBtn.disabled = true;

      try {
        const response = await fetch(
          "/api/admin/results-status",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            credentials: "same-origin",
            body: JSON.stringify({ published })
          }
        );

        const data = await response.json();

        if (!response.ok || !data.success) {
          statusBox.textContent =
            data.message || "পরিবর্তন করা যায়নি।";
          return;
        }

        statusBox.textContent = data.message;
        await loadStatus();

      } catch (error) {
        statusBox.textContent = "সার্ভারের সঙ্গে যোগাযোগ করা যায়নি।";
      } finally {
        publishBtn.disabled = false;
        hideBtn.disabled = false;
      }
    }

    publishBtn.addEventListener("click", () => {
      setPublication(true);
    });

    hideBtn.addEventListener("click", () => {
      setPublication(false);
    });

    loadStatus();
  </script>
</body>
</html>
