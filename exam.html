    function renderQuestion() {
      const question = questions[currentIndex];

      document.getElementById("progress").textContent =

      document.getElementById("questionText").textContent =

        const label = document.createElement("label");

        const radio = document.createElement("input");
        radio.type = "radio";
        radio.name = "answer";
        radio.value = String(index);
        radio.checked = answers[question.id] === index;

        radio.addEventListener("change", () => {
          answers[question.id] = index;
        });

        label.append(radio, document.createTextNode(" " + option));
        optionsBox.appendChild(label);
      });

      document.getElementById("previousButton").disabled =
        currentIndex === 0;

      document.getElementById("nextButton").hidden =
        currentIndex === questions.length - 1;

      document.getElementById("submitButton").hidden =
        currentIndex !== questions.length - 1;
    }

    document.getElementById("previousButton").addEventListener(
      "click", () => {
        if (currentIndex > 0) {
          currentIndex--;
          renderQuestion();
        }
      }
    );

    document.getElementById("nextButton").addEventListener(

        if (currentIndex < questions.length - 1) {

            },
            body: JSON.stringify({

                selectedOption: answers[question.id] ?? null
              }))
            })
          });

          message.textContent =

          message.textContent =

      }
